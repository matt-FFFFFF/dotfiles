# vim:fileencoding=utf-8:foldmethod=marker

term xterm-kitty

# BEGIN_KITTY_FONTS
font_family      family="Cascadia Code NF"
bold_font        family="Cascadia Code NF"
italic_font      family="Cascadia Code NF"
bold_italic_font family="Cascadia Code NF"
font_size 10.0
# END_KITTY_FONTS

background_opacity 0.9

# hide_window_decorations yes
window_padding_width 2

map ctrl+shift+p no_op
map ctrl+shift+n no_op
map shift+enter send_text all \x1b[13;2u

window_logo_path ~/termbk.png
window_logo_alpha 0.3
window_logo_position center

macos_option_as_alt left

cursor_trail 3
cursor_shape block
cursor_trail_decay 0.1 0.3

mouse_map right press ungrabbed mouse_select_command_output

shell_integration no-cursor

copy_on_select clipboard

mouse_map left release ungrabbed copy_to_clipboard
