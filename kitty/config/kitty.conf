# vim:fileencoding=utf-8:foldmethod=marker

term xterm-kitty

allow_remote_control yes
# /tmp works on both Linux and macOS (kitty appends -PID); theme-set globs
# /tmp/kitty.sock* to live-apply colors
listen_on unix:/tmp/kitty.sock

# colors.conf is rendered by theme-set (bin/theme-set <theme>)
include colors.conf

# BEGIN_KITTY_FONTS
font_family      family="Cascadia Code NF"
bold_font        family="Cascadia Code NF"
italic_font      family="Cascadia Code NF"
bold_italic_font family="Cascadia Code NF"
font_size 14.0
# END_KITTY_FONTS

background_opacity 0.95
dynamic_background_opacity yes

hide_window_decorations yes
window_padding_width 2
remember_window_position yes
remember_window_size yes

map ctrl+shift+p no_op
map ctrl+shift+n no_op
map shift+enter send_text all \x1b[13;2u

window_logo_path ~/termbk.png
window_logo_alpha 0.3
window_logo_position center
window_logo_scale 10

macos_option_as_alt left

cursor_trail 3
cursor_shape block
cursor_trail_decay 0.1 0.3

mouse_map right press ungrabbed mouse_select_command_output

shell_integration no-cursor

copy_on_select clipboard

open_url_with xdg-open
