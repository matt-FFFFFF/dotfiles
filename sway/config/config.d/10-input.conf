# ── Input ────────────────────────────────────────────────────────────────────
# vim: ft=swayconfig

input type:keyboard {
    xkb_layout   gb
    xkb_options  compose:caps
    repeat_delay 300
    repeat_rate  40
}

input type:touchpad {
    natural_scroll  enabled
    tap             enabled
    dwt             enabled
    scroll_method   two_finger
}

input type:pointer {
    accel_profile flat
    pointer_accel 0
}
