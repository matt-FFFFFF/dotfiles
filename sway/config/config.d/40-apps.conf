# ── Application Key Bindings ─────────────────────────────────────────────────
# vim: ft=swayconfig

# Terminal
bindsym $mod+Return exec $term

# Browser
bindsym $mod+shift+Return exec $browser

# App launcher
bindsym $mod+space exec $launcher

# Waybar toggle
bindsym $mod+shift+space exec pkill -SIGUSR1 waybar

# Emoji picker
bindsym $mod+ctrl+e exec rofi -show emoji 2>/dev/null || rofi -show run

# Calculator
bindsym XF86Calculator exec gnome-calculator

# Screenshot
bindsym Print         exec grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Copied to clipboard"
bindsym Alt+Print     exec grim - | wl-copy && notify-send "Screenshot" "Full screen copied to clipboard"
bindsym $mod+Print    exec grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png && notify-send "Screenshot" "Saved to ~/Pictures"

# Lock screen
bindsym $mod+ctrl+l exec /usr/bin/swaylock --config ~/.config/swaylock/config

# Nightlight toggle
bindsym $mod+ctrl+n exec pkill wlsunset && notify-send "Nightlight" "Off" || (wlsunset -t 3500 -T 6500 & notify-send "Nightlight" "On")

# Show time
bindsym $mod+ctrl+alt+t exec notify-send "    $(date +"%A %H:%M  —  %d %B W%V %Y")"
