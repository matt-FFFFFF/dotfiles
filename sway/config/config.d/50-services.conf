# ── Autostart Services ───────────────────────────────────────────────────────
# vim: ft=swayconfig

# Bar
exec_always sh -c 'pkill waybar; GTK_THEME=Adwaita:dark /usr/bin/waybar'

# Notifications
exec_always sh -c 'pkill dunst; /usr/bin/dunst'

# Suppress applets (nm/blueman managed via waybar modules instead)
exec_always pkill nm-applet
exec_always pkill blueman-applet

# Autotiling
exec_always sh -c 'pkill autotiling; autotiling'

# Screen lock / idle
exec /usr/bin/swayidle -w \
    timeout 300  '/usr/bin/swaylock --config ~/.config/swaylock/config' \
    timeout 600  '/usr/bin/swaymsg "output * dpms off"' \
    resume       '/usr/bin/swaymsg "output * dpms on"' \
    before-sleep '/usr/bin/swaylock --config ~/.config/swaylock/config'

# Polkit authentication agent
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 2>/dev/null || \
     /usr/lib64/polkit-gnome/polkit-gnome-authentication-agent-1 2>/dev/null || \
     /usr/libexec/polkit-gnome-authentication-agent-1 2>/dev/null

# Import environment for systemd / dbus
exec systemctl --user import-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP
exec dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP
