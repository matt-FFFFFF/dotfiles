# ── Key Bindings ─────────────────────────────────────────────────────────────
# vim: ft=swayconfig

# Window switcher
bindsym alt+Tab       exec rofi -show window -show-icons -theme ~/.config/rofi/drun.rasi
bindsym alt+shift+Tab exec rofi -show window -show-icons -theme ~/.config/rofi/drun.rasi

# ── Window Management ────────────────────────────────────────────────────────

# Close window
bindsym $mod+w kill

# Toggle floating
bindsym $mod+t floating toggle

# Toggle fullscreen
bindsym $mod+f fullscreen toggle

# Toggle tiling layout
bindsym $mod+j layout toggle split

# Stacking / tabbed / default layouts
bindsym $mod+g layout tabbed
bindsym $mod+s layout stacking
bindsym $mod+e layout default

# Toggle window transparency / gaps
bindsym $mod+BackSpace            opacity 1.0
bindsym $mod+shift+BackSpace      gaps inner all set 5; gaps outer all set 10
bindsym $mod+shift+ctrl+BackSpace gaps inner all set 0; gaps outer all set 0

# Drag floating windows with mouse
floating_modifier $mod normal

# Mouse scroll on title bar changes focus
bindsym --border $mod+button4 focus prev sibling
bindsym --border $mod+button5 focus next sibling

# Move focus
bindsym $mod+Left  focus left
bindsym $mod+Right focus right
bindsym $mod+Up    focus up
bindsym $mod+Down  focus down

# Move windows
bindsym $mod+shift+Left  move left
bindsym $mod+shift+Right move right
bindsym $mod+shift+Up    move up
bindsym $mod+shift+Down  move down

# Resize
bindsym $mod+minus       resize shrink width  50px
bindsym $mod+equal       resize grow   width  50px
bindsym $mod+shift+minus resize shrink height 50px
bindsym $mod+shift+equal resize grow   height 50px

mode "resize" {
    bindsym Left   resize shrink width  10px
    bindsym Right  resize grow   width  10px
    bindsym Up     resize shrink height 10px
    bindsym Down   resize grow   height 10px
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym $mod+r mode "default"
}
bindsym $mod+r mode "resize"

# ── Workspaces ───────────────────────────────────────────────────────────────

# Switch to workspace
bindsym $mod+1 workspace $ws1
bindsym $mod+2 workspace $ws2
bindsym $mod+3 workspace $ws3
bindsym $mod+4 workspace $ws4
bindsym $mod+5 workspace $ws5
bindsym $mod+6 workspace $ws6
bindsym $mod+7 workspace $ws7
bindsym $mod+8 workspace $ws8
bindsym $mod+9 workspace $ws9
bindsym $mod+0 workspace $ws10

# Move window to workspace
bindsym $mod+shift+1 move container to workspace $ws1
bindsym $mod+shift+2 move container to workspace $ws2
bindsym $mod+shift+3 move container to workspace $ws3
bindsym $mod+shift+4 move container to workspace $ws4
bindsym $mod+shift+5 move container to workspace $ws5
bindsym $mod+shift+6 move container to workspace $ws6
bindsym $mod+shift+7 move container to workspace $ws7
bindsym $mod+shift+8 move container to workspace $ws8
bindsym $mod+shift+9 move container to workspace $ws9
bindsym $mod+shift+0 move container to workspace $ws10

# Move window silently to workspace (move without following)
bindsym $mod+shift+alt+1 move container to workspace $ws1
bindsym $mod+shift+alt+2 move container to workspace $ws2
bindsym $mod+shift+alt+3 move container to workspace $ws3
bindsym $mod+shift+alt+4 move container to workspace $ws4
bindsym $mod+shift+alt+5 move container to workspace $ws5
bindsym $mod+shift+alt+6 move container to workspace $ws6
bindsym $mod+shift+alt+7 move container to workspace $ws7
bindsym $mod+shift+alt+8 move container to workspace $ws8
bindsym $mod+shift+alt+9 move container to workspace $ws9
bindsym $mod+shift+alt+0 move container to workspace $ws10

# Tab between workspaces
bindsym $mod+Tab       workspace next
bindsym $mod+shift+Tab workspace prev
bindsym $mod+ctrl+Tab  workspace back_and_forth

# Scroll through workspaces
bindsym --whole-window $mod+button4 workspace prev
bindsym --whole-window $mod+button5 workspace next

# Move workspace to other output
bindsym $mod+shift+alt+Left  move workspace to output left
bindsym $mod+shift+alt+Right move workspace to output right
bindsym $mod+shift+alt+Up    move workspace to output up
bindsym $mod+shift+alt+Down  move workspace to output down

# ── Media & Volume ───────────────────────────────────────────────────────────

bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute        exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioMicMute     exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindsym --locked alt+XF86AudioRaiseVolume exec wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 1%+
bindsym --locked alt+XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-

bindsym --locked XF86MonBrightnessUp       exec brightnessctl set +5%
bindsym --locked XF86MonBrightnessDown     exec brightnessctl set 5%-
bindsym --locked alt+XF86MonBrightnessUp   exec brightnessctl set +1%
bindsym --locked alt+XF86MonBrightnessDown exec brightnessctl set 1%-

bindsym --locked XF86KbdBrightnessUp   exec brightnessctl -d *::kbd_backlight set +10% 2>/dev/null
bindsym --locked XF86KbdBrightnessDown exec brightnessctl -d *::kbd_backlight set 10%- 2>/dev/null

bindsym --locked XF86AudioNext  exec playerctl next
bindsym --locked XF86AudioPrev  exec playerctl previous
bindsym --locked XF86AudioPlay  exec playerctl play-pause
bindsym --locked XF86AudioPause exec playerctl play-pause

# ── Notifications ────────────────────────────────────────────────────────────

bindsym $mod+comma       exec dunstctl close
bindsym $mod+shift+comma exec dunstctl close-all
bindsym $mod+alt+comma   exec dunstctl action 0

# ── System ───────────────────────────────────────────────────────────────────

bindsym $mod+shift+c reload
bindsym $mod+shift+e exec ~/.config/sway/exit.sh

bindsym XF86PowerOff exec swaynag -t warning -m 'Power off?' \
    -B 'Power off' 'systemctl poweroff' \
    -B 'Reboot'    'systemctl reboot' \
    -B 'Suspend'   'systemctl suspend' \
    -B 'Lock'      '/usr/bin/swaylock --config ~/.config/swaylock/config'
